name: Build Android app

# Run it by hand (Actions tab -> Build Android app -> Run workflow). The .apk is saved as "VA-EME-android".
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: mobile
        run: npm install --no-audit --no-fund && npx cap sync android
      - name: Signing key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build .apk
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: VA-EME-android
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

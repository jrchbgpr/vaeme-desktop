name: Build Mac app

# Run it by hand (Actions tab -> Build Mac app -> Run workflow),
# or push a tag like v0.1.0-test.1 to also publish the .dmg files as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build .dmg (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Save the .dmg files
        uses: actions/upload-artifact@v4
        with:
          name: VA-EME-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

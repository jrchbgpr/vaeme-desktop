<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA EME</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px -apple-system, "Segoe UI", sans-serif; background: #f8f6f2; color: #1f2328; }
  @media (prefers-color-scheme: dark) { body { background: #1f2328; color: #f1ede6; } }
  main { text-align: center; max-width: 360px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; opacity: .75; line-height: 1.5; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px; background: #a87a52; color: #1f1408; cursor: pointer; }
  button:hover { background: #bb8c63; }
  button:focus-visible { outline: 3px solid #a87a52; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach VA EME</h1>
  <p>Check your internet connection. It will reconnect on its own when you're back online.</p>
  <button id="retry">Try again</button>
  <p id="details" style="margin:20px 0 0;font-size:12px;opacity:.55;word-break:break-all"></p>
</main>
<script>
  const APP = "https://app.vaeme.pro/app";
  const q = new URLSearchParams(location.search);
  if (q.get("desc")) document.getElementById("details").textContent = "Error " + q.get("code") + ": " + q.get("desc") + " (" + q.get("url") + ")";
  document.getElementById("retry").addEventListener("click", () => { location.href = APP; });
  window.addEventListener("online", () => { location.href = APP; });
</script>
</body>
</html>
